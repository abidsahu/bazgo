      - name: Make logo files from your Bazgo logo (logo itself is never edited)
        run: |
          LOGO=$(ls *.png *.PNG *.jpg *.jpeg 2>/dev/null | head -n 1 || true)
          if [ -z "$LOGO" ]; then
            echo "::error::Bazgo logo image not found. Upload your logo (png) to the top of the repository."
            exit 1
          fi
          echo "Using logo: $LOGO"
          mkdir -p assets/branding store_assets
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pillow numpy
          /tmp/venv/bin/python - "$LOGO" <<'PY'
          import shutil, sys
          from PIL import Image
          src = sys.argv[1]
          dst = "assets/branding/bazgo_logo_original.png"
          if src.lower().endswith(".png"):
              shutil.copyfile(src, dst)  # a PNG is copied byte-for-byte, untouched
          else:
              Image.open(src).convert("RGB").save(dst)
          PY
          /tmp/venv/bin/python tools/generate_brand_assets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write build configuration (from GitHub secrets)
        run: |
          cat > env.json <<'EOF'
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "ADMOB_BANNER_ID": "${{ secrets.ADMOB_BANNER_ID || 'ca-app-pub-3940256099942544/6300978111' }}",
            "ADMOB_INTERSTITIAL_ID": "${{ secrets.ADMOB_INTERSTITIAL_ID || 'ca-app-pub-3940256099942544/1033173712' }}",
            "ADMOB_APP_OPEN_ID": "${{ secrets.ADMOB_APP_OPEN_ID || 'ca-app-pub-3940256099942544/9257395921' }}"
          }
          EOF

      - name: Prepare Android project
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: bash tool/setup_android.sh

      - run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: bazgo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
